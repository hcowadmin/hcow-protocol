# Foundry sits alongside the Hardhat project rather than replacing it.
#
# Hardhat still owns compilation, deployment, the unit suites and the flattened
# output that BscScan verification uses. Foundry is here for one thing the
# hand-written suites structurally cannot do: let a machine search the state
# space instead of replaying the sequences the author thought of. Every defect
# in this repository's history was found by someone constructing a scenario,
# and a scenario the author does not think of is not tested by a suite the
# author wrote.
[profile.default]
src = "contracts"
test = "foundry"
out = "foundry-out"
cache_path = "foundry-cache"
libs = ["node_modules", "foundry/lib"]
# svm-rs cannot reach binaries.soliditylang.org from here, and the pinned
# compiler has to match what Hardhat and BscScan use anyway.
solc = "/usr/local/bin/solc"
# evm_version is pinned to "paris" DELIBERATELY and must match
# hardhat.config.cjs, the other repository's foundry.toml and compile.cjs
# exactly. The compiler settings are part of the BscScan verification input, so
# a mismatch produces different bytecode and a verification failure with no
# useful error. paris rather than shanghai or cancun is a portability choice
# rather than a capability one: BNB Chain supports PUSH0, transient storage and
# MCOPY, nothing here uses them, and paris keeps the deployed bytecode free of
# any opcode a fork, an archive node or an auditor's tooling might not
# implement. See hardhat.config.cjs for the full rationale.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=foundry/lib/forge-std/src/"]
# foundry/medusa holds the Medusa harness. It inherits the invariant contract
# so the properties are never restated, which also means forge would discover
# it as a second copy of the same suite and run every property twice.
no_match_contract = "Medusa"


[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

[profile.deep.invariant]
runs = 2000
depth = 400
fail_on_revert = false
shrink_run_limit = 20000
